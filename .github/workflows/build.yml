name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.ver.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Đặt tên phiên bản
        id: ver
        run: |
          VN="1.0.${{ github.run_number }}"
          D=$(TZ=Asia/Bangkok date +%Y-%m-%d_%Hh%M)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "label=Version $VN - ngày ${D/_/ lúc } (giờ VN) - $SHA" >> "$GITHUB_OUTPUT"
          echo "file=BookScanner_Version-${VN}_${D}_${SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -Pvc=${{ github.run_number }} -Pvn=${{ steps.ver.outputs.vn }}

      - name: Đổi tên APK theo phiên bản
        run: |
          mkdir -p apk_out
          cp app/build/outputs/apk/debug/*.apk "apk_out/${{ steps.ver.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: BookScanner-debug-apk
          path: apk_out/*.apk

  release:
    name: Đăng bản tải về (Releases)
    needs: [apk]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Gom file
        run: |
          mkdir -p out
          cp dist/BookScanner-debug-apk/*.apk out/
          ls -la out

      # Push tag v*  -> bản phát hành chính thức
      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

      # Push main/master -> luôn cập nhật bản "latest" để tải APK mới nhất ở mục Releases
      - name: Dời tag latest về commit mới
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
      - name: Release latest
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bản mới nhất ${{ needs.apk.outputs.label }}
          prerelease: true
          files: out/*
